[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-mdl"        # the command is mdl; that name was taken
dynamic = ["version"]
description = "Run one local llama.cpp server from a config file, with an optional terminal dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "diverse" }]
keywords = ["llama.cpp", "llm", "gguf", "cli", "tui", "local-ai"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/diverseau/llama-mdl"
Repository = "https://github.com/diverseau/llama-mdl"
Issues = "https://github.com/diverseau/llama-mdl/issues"
Changelog = "https://github.com/diverseau/llama-mdl/blob/main/CHANGELOG.md"

# Only the dashboard has a dependency, and mdl.py never imports it, so
# `pip install llama-mdl` stays dependency-free.
[project.optional-dependencies]
# Tested floor, not a guess: 2.x fails the suite, 3.0 passes. Capped at
# the next major because a TUI is exactly the kind of dependency that
# breaks quietly.
ui = ["textual>=3,<9"]

[project.scripts]
mdl = "mdl:main"

[tool.setuptools]
py-modules = ["mdl", "mdl_ui"]

[tool.setuptools.dynamic]
version = { attr = "mdl.VERSION" }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear: the rules that catch mistakes.
# Deliberately not isort - the test files set sys.path before importing
# mdl, and reordering those imports breaks them - and not pyupgrade,
# which would rewrite most of the % formatting for no behaviour change.
select = ["E", "F", "W", "B"]
