[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-mdl"        # the command is mdl; that name was taken
dynamic = ["version"]
description = "Run local llama.cpp servers from a config file, and work out which model to run and how"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "diverse" }]
keywords = ["llama.cpp", "llm", "gguf", "cli", "tui", "local-ai"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
# The terminal dashboard comes with every install: one command to install,
# and bare `mdl` always opens it. Tested floor, not a guess: 2.x fails the
# suite, 3.0 passes. Capped at the next major because a TUI is exactly the
# kind of dependency that breaks quietly. mdl.py still imports it only in
# the `tui` handler, so a broken textual can break nothing but the TUI.
dependencies = ["textual>=3,<9"]

[project.urls]
Homepage = "https://github.com/diverseau/llama-mdl"
Repository = "https://github.com/diverseau/llama-mdl"
Issues = "https://github.com/diverseau/llama-mdl/issues"
Changelog = "https://github.com/diverseau/llama-mdl/blob/main/CHANGELOG.md"

# Kept so that `pip install "llama-mdl[ui]"` from before 0.13 still works;
# the dashboard's dependency is a plain one now, so it adds nothing.
[project.optional-dependencies]
ui = []

[project.scripts]
mdl = "mdl:main"

[tool.setuptools]
py-modules = ["mdl", "mdl_ui", "mdl_update"]
packages = ["mdl_fit", "mdl_web"]

[tool.setuptools.package-data]
mdl_web = ["static/*", "NOTICE"]

[tool.setuptools.dynamic]
version = { attr = "mdl.VERSION" }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear: the rules that catch mistakes.
# Deliberately not isort - the test files set sys.path before importing
# mdl, and reordering those imports breaks them - and not pyupgrade,
# which would rewrite most of the % formatting for no behaviour change.
select = ["E", "F", "W", "B"]
