name: release

# Tagging v* publishes to PyPI. No API token is stored anywhere: PyPI is
# configured to trust this workflow in this repository, and the job proves
# who it is with a short-lived OIDC token.
#
#   git tag -a v0.1.0 -m "0.1.0" && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The tag must match the version in mdl.py
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          actual=$(python -c "import mdl; print(mdl.VERSION)")
          echo "tag $tagged, mdl.VERSION $actual"
          test "$tagged" = "$actual"
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write            # all Trusted Publishing needs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
