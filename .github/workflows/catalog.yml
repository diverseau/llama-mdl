name: catalog

# Nightly crawl of the Hugging Face model tree into the SQLite snapshot
# `mdl find` reads, published as a dataset. Needs a write token in the
# HF_TOKEN secret and a dataset repo named by the CATALOG_REPO variable
# (default diversemate/mdl-catalog). Off until the CATALOG_ENABLED variable
# is "true", so it does not crawl for hours only to fail at the upload;
# does nothing on forks.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  crawl:
    if: github.repository_owner == 'diverseau' && vars.CATALOG_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MDL_CATALOG_REPO: ${{ vars.CATALOG_REPO || 'diversemate/mdl-catalog' }}
      MDL_FIT_HOME: ${{ github.workspace }}/.mdl
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip huggingface_hub
      - name: Last night's snapshot, to reuse unchanged file lists
        run: python mdl.py catalog pull || true
      - name: Crawl
        run: |
          python mdl.py catalog build --max-nodes 40000 \
            --from .mdl/cache/catalog.sqlite --out catalog.sqlite
      - name: Publish
        run: |
          hf upload "$MDL_CATALOG_REPO" catalog.sqlite catalog.sqlite \
            --repo-type dataset --commit-message "nightly $(date -u +%F)"
