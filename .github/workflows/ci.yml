name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with the dashboard extra
        run: python -m pip install --upgrade pip && python -m pip install ".[ui]"
      - name: Run the fast suites
        run: python tests/run.py
        env:
          PYTHONIOENCODING: utf-8

  posix:
    name: posix process semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detach, orphan self-heal, SIGTERM -> SIGKILL
        run: python tests/integration_posix.py

  oldpython:
    name: refuses 3.10 politely
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: One line, not a traceback
        run: |
          out=$(python mdl.py --version 2>&1) && status=0 || status=$?
          echo "$out"
          test "$status" -eq 1
          echo "$out" | grep -q "needs Python 3.11"
          test "$(echo "$out" | wc -l)" -eq 1

  build:
    name: wheel builds and installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Core install pulls in nothing
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          # One line means the wheel brought nothing along with it.
          test "$(/tmp/v/bin/pip list --format=freeze --exclude pip --exclude setuptools | wc -l)" -eq 1
          /tmp/v/bin/mdl --version
