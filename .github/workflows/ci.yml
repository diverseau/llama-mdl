name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with the dashboard extra
        run: python -m pip install --upgrade pip && python -m pip install ".[ui]"
      - name: Run the fast suites
        run: python tests/run.py
        env:
          PYTHONIOENCODING: utf-8

  textual:
    name: textual ${{ matrix.textual }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pinned floor and whatever is current. The floor is a tested
        # claim, not a guess: 2.x fails these suites.
        textual: ["3.0.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          if [ "${{ matrix.textual }}" = "latest" ]; then
            python -m pip install --upgrade textual
          else
            python -m pip install "textual==${{ matrix.textual }}"
          fi
          python -c "import textual; print('textual', textual.__version__)"
      - run: python tests/run.py
        env:
          PYTHONIOENCODING: utf-8

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  posix:
    name: posix process semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detach, orphan self-heal, SIGTERM -> SIGKILL, tree kill
        run: python tests/integration_posix.py

  oldpython:
    name: refuses 3.10 politely
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: One line, not a traceback
        run: |
          out=$(python mdl.py --version 2>&1) && status=0 || status=$?
          echo "$out"
          test "$status" -eq 1
          echo "$out" | grep -q "needs Python 3.11"
          test "$(echo "$out" | wc -l)" -eq 1

  build:
    name: wheel and sdist install clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Each artifact installs, and brings nothing with it
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            rm -rf /tmp/v
            python -m venv /tmp/v
            /tmp/v/bin/pip install "$artifact"
            /tmp/v/bin/mdl --version
            # One line means the package pulled in no dependencies.
            test "$(/tmp/v/bin/pip list --format=freeze --exclude pip --exclude setuptools | wc -l)" -eq 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
